<!doctype html>
<html data-i18n-title="popupTitle">
<head>
<meta charset="utf-8">
<title>Notestark</title>
<style>
  /* The menu is styled as a marked-up page, because that is what this extension
     makes. The active tab is not a pill or a rail item — it is a highlighter
     stroke, drawn slightly crooked and slightly irregular, the way a real one
     lands. Same for the colour editor: the colours are shown as strokes over
     sample text rather than as squares, so what you pick is what you will see. */
  :root {
    --paper: #fffdf7; --ink: #1f2937; --muted: #6b7280; --rule: #e7e2d4;
    --panel: #f6f3ea; --hi: #efe9db;
    --ok: #137333; --warn: #b06000;
    --brand: #ffd54a; --link: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181d; --ink: #e8ecf1; --muted: #94a1b0; --rule: #2b333d;
      --panel: #1b2027; --hi: #232b34;
      --ok: #81c995; --warn: #fdd663;
      --brand: #ffd54a; --link: #ffc933;
    }
  }

  * { box-sizing: border-box; }
  body {
    width: 372px; margin: 0; background: var(--paper); color: var(--ink);
    font: 13px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  button { font: inherit; }

  /* --- masthead ----------------------------------------------------------- */
  .top { display: flex; align-items: baseline; gap: 8px; padding: 13px 16px 0; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: -.02em; position: relative; }
  /* The product name wears its own product. */
  .wordmark::before {
    content: ''; position: absolute; left: -3px; right: -3px; top: 55%; bottom: 4%;
    background: var(--brand); border-radius: 3px 7px 2px 6px / 5px 2px 6px 3px;
    transform: rotate(-.5deg); z-index: 0;
  }
  .wordmark span { position: relative; z-index: 1; }
  .ver { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* --- tabs --------------------------------------------------------------- */
  .tabs { display: flex; gap: 2px; padding: 12px 12px 0; border-bottom: 1px solid var(--rule); }
  .tab {
    position: relative; border: 0; background: none; cursor: pointer;
    padding: 5px 9px 9px; color: var(--muted); font-size: 12.5px; font-weight: 550;
  }
  .tab span { position: relative; z-index: 1; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; }
  /* The stroke: crooked, uneven corners, overshooting the word slightly. */
  .tab[aria-selected="true"]::before {
    content: ''; position: absolute; left: 3px; right: 3px; top: 34%; bottom: 26%;
    background: var(--brand); border-radius: 2px 7px 3px 6px / 6px 2px 7px 3px;
    transform: rotate(-.8deg); z-index: 0;
  }

  main { padding: 14px 16px 16px; min-height: 268px; display: flex; flex-direction: column; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

  /* --- access ------------------------------------------------------------- */
  .state { display: flex; gap: 9px; align-items: baseline; margin: 0 0 4px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
  .state[data-on="yes"] .pip { background: var(--ok); }
  .state[data-on="no"] .pip { background: var(--warn); }
  .state strong { font-size: 13px; font-weight: 650; }
  .state[data-on="yes"] strong { color: var(--ok); }
  .state[data-on="no"] strong { color: var(--warn); }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 10px 16px; }

  .btn {
    display: block; width: 100%; margin-top: 7px; cursor: pointer;
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 650;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  }
  .btn:hover { opacity: .88; }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule); font-weight: 500; }
  .btn.quiet:hover { opacity: 1; background: var(--hi); }
  .btn.tiny { font-size: 12px; padding: 6px 10px; margin-top: 12px; }

  .row { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .host { font: 12px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; margin: 0 0 3px; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }

  /* --- recent ------------------------------------------------------------- */
  .doc { margin-bottom: 12px; }
  .doc > a {
    display: flex; align-items: baseline; gap: 8px; text-decoration: none;
    color: var(--ink); padding: 4px 6px; border-radius: 7px;
  }
  .doc > a:hover { background: var(--hi); }
  .doc .where {
    font-weight: 650; font-size: 12.5px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc .when { font-size: 11px; color: var(--muted); flex: none; }
  .doc ul { list-style: none; margin: 2px 0 0; padding: 0 0 0 6px; }
  .doc li { display: flex; gap: 7px; align-items: flex-start; padding: 3px 0; font-size: 12px; }
  .doc li .sw { width: 9px; height: 9px; border-radius: 2px; margin-top: 4px; flex: none; }
  .doc li .sw.rule { background: repeating-linear-gradient(180deg, transparent 0 5px, currentColor 5px 7px); }
  .doc li .ex { color: var(--muted); overflow: hidden; display: -webkit-box;
                -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .doc .more { font-size: 11px; color: var(--muted); padding: 2px 0 0 6px; }
  .none { color: var(--muted); font-size: 12.5px; padding: 18px 4px; text-align: center; }

  /* --- colours ------------------------------------------------------------ */
  .strokes { display: flex; flex-direction: column; gap: 2px; }
  /* A label, not a button: it forwards a click to the input it wraps, which is
     what makes one click enough. See the note in popup.js. */
  .stroke {
    position: relative; display: flex; align-items: center; gap: 8px;
    padding: 3px 6px; border-radius: 7px; cursor: pointer; width: 100%;
  }
  .stroke:focus-within { outline: 2px solid var(--link); outline-offset: 1px; }
  .stroke:hover { background: var(--hi); }
  .stroke .mark { position: relative; flex: none; padding: 2px 5px; font-size: 12.5px; }
  .stroke .mark::before {
    content: ''; position: absolute; inset: 8% -2px 10% -2px;
    background: var(--c, var(--brand));
    border-radius: 2px 6px 3px 5px / 5px 2px 6px 3px; transform: rotate(-.5deg); z-index: 0;
  }
  .stroke .mark em { position: relative; z-index: 1; font-style: normal; color: #1f2937; }
  /* Underline is a rule under the text, not a wash behind it, so it is drawn as one. */
  .stroke[data-kind="rule"] .mark::before { inset: auto -2px 12% -2px; height: 2px; border-radius: 0; }
  .stroke[data-kind="rule"] .mark em { color: var(--ink); }

  .ratio { margin-left: auto; font: 11px/1 ui-monospace, Consolas, monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ratio.low { color: var(--warn); font-weight: 700; }
  .ratio.na { opacity: .5; }
  .picker { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* --- add-ons ------------------------------------------------------------ */
  .card { border: 1px solid var(--rule); border-radius: 10px; padding: 11px 12px; background: var(--panel); }
  .card h3 { margin: 0 0 3px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .card p { margin: 0; font-size: 12px; color: var(--muted); }
  .switch {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule);
    font-size: 12.5px;
  }
  .switch input { width: 15px; height: 15px; accent-color: var(--ink); cursor: pointer; }

  .field { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 12.5px; }
  .field select {
    flex: 1; font: inherit; font-size: 12.5px; padding: 5px 7px;
    border: 1px solid var(--rule); border-radius: 7px;
    background: var(--paper); color: var(--ink);
  }
  .fine { margin-top: 10px !important; font-size: 11.5px; line-height: 1.45; }
  .soon.ok { color: var(--ok); border-color: currentColor; }

  .soon {
    font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--rule); border-radius: 20px; padding: 1px 7px;
  }

  /* --- about -------------------------------------------------------------- */
  .about { margin: auto 0; }
  .about p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
  .links { display: flex; flex-direction: column; gap: 1px; }
  .links a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 12.5px;
  }
  .links a:hover { background: var(--hi); }
  .links a::after { content: '→'; color: var(--muted); }
  .foot {
    margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; font-size: 11px; color: var(--muted);
  }
</style>
</head>
<body>

<div class="top">
  <span class="wordmark"><span>Notestark</span></span>
  <span class="ver" id="version"></span>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" data-tab="recent"  role="tab" aria-selected="true"><span data-i18n="qmRecent"></span></button>
  <button class="tab" data-tab="access"  role="tab" aria-selected="false"><span data-i18n="qmAccess"></span></button>
  <button class="tab" data-tab="colours" role="tab" aria-selected="false"><span data-i18n="qmColours"></span></button>
  <button class="tab" data-tab="addons"  role="tab" aria-selected="false"><span data-i18n="qmAddons"></span></button>
  <button class="tab" data-tab="about"   role="tab" aria-selected="false"><span data-i18n="qmAbout"></span></button>
</nav>

<main>

  <!-- ACCESS --------------------------------------------------------------- -->
  <section data-panel="access" hidden>
    <div class="state" id="file-state" data-on="?">
      <span class="pip" aria-hidden="true"></span>
      <strong id="file-title" data-i18n="popupChecking"></strong>
    </div>
    <p class="sub" id="file-detail"></p>

    <button class="btn" id="fix" type="button" hidden data-i18n="popupBtnFix"></button>
    <button class="btn quiet" id="guide" type="button" data-i18n="popupBtnGuide"></button>

    <p class="note" id="ctx" style="margin-top:10px"></p>

    <div class="row" id="site" hidden>
      <p class="host" id="site-origin"></p>
      <p class="note" id="site-state"></p>
      <button class="btn" id="site-toggle" type="button"></button>
    </div>

    <div class="row">
      <p class="note" id="all-state"></p>
      <button class="btn quiet" id="all-toggle" type="button"></button>
    </div>
  </section>

  <!-- RECENT ---------------------------------------------------------------- -->
  <section data-panel="recent">
    <p class="hint" data-i18n="qmRecentHint"></p>
    <div id="recent"></div>
  </section>

  <!-- COLOURS -------------------------------------------------------------- -->
  <section data-panel="colours" hidden>
    <p class="hint" data-i18n="qmColoursHint"></p>
    <div class="strokes" id="strokes"></div>
    <label class="switch">
      <input type="checkbox" id="pulse">
      <span data-i18n="qmPulse"></span>
    </label>
    <p class="fine" data-i18n="qmPulseWhy"></p>

    <button class="btn quiet tiny" id="palette-reset" type="button" data-i18n="qmReset"></button>
  </section>

  <!-- ADD-ONS -------------------------------------------------------------- -->
  <section data-panel="addons" hidden>
    <p class="hint" data-i18n="qmAddonsHint"></p>
    <div class="card">
      <h3><span data-i18n="qmTranslate"></span><span class="soon" id="tr-badge"></span></h3>
      <p data-i18n="qmTranslateDesc"></p>

      <label class="field" id="tr-field" hidden>
        <span data-i18n="qmTargetLang"></span>
        <select id="tr-target"></select>
      </label>

      <p class="fine" id="tr-note"></p>
    </div>
  </section>

  <!-- ABOUT ---------------------------------------------------------------- -->
  <section data-panel="about" hidden>
    <div class="about">
      <p data-i18n="qmTagline"></p>
      <div class="links">
        <a id="lnk-src" href="#" target="_blank" rel="noreferrer" data-i18n="qmSource"></a>
        <a id="lnk-bug" href="#" target="_blank" rel="noreferrer" data-i18n="qmIssues"></a>
        <a id="lnk-priv" href="#" target="_blank" rel="noreferrer" data-i18n="qmPrivacy"></a>
        <a id="lnk-guide" href="#" data-i18n="popupBtnGuide"></a>
      </div>
    </div>
    <div class="foot">
      <span>GPL-3.0</span>
      <span data-i18n="qmLocalOnly"></span>
    </div>
  </section>

</main>

<script type="module" src="popup.js"></script>
</body>
</html>
